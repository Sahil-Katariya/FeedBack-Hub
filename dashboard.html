<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - FeedbackHub</title>
  <link rel="icon" href="ico.ico" type="image/x-icon" />
  <link rel="stylesheet" href="https://unpkg.com/animate.css@4.1.1/animate.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&amp;display=swap" data-tag="font" />
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header class="main-header" role="banner">
    <div class="header-content">
      <a href="/index.html" class="logo-link">
        <img src="icon_trans.png" alt="Feedback Hub" width="184" height="80" class="logo">
      </a>
      <nav class="navbar-links" role="navigation" aria-label="Main navigation">
        <ul class="nav-list">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="dashboard.html" class="nav-link active">Dashboard</a></li>
          <li><a href="#" id="logout-btn" class="nav-link">Logout</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="dashboard-container">
      <div class="dashboard-header">
        <div id="user-info"></div>
        <div class="dashboard-stats">
          <div class="stat-card">
            <h3>Total Reviews</h3>
            <p id="total-reviews">0</p>
          </div>
          <div class="stat-card">
            <h3>Average Rating</h3>
            <p id="avg-rating">0.0</p>
          </div>
          <div class="stat-card">
            <h3>Products</h3>
            <p id="total-products">0</p>
          </div>
        </div>
      </div>

      <div class="dashboard-content">
        <div class="dashboard-section">
          <h2>Products</h2>
          <div id="products-container" class="products-grid"></div>
        </div>

        <div class="dashboard-section">
          <h2>Recent Reviews</h2>
          <div id="reviews-container" class="reviews-list"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer section-padding">
    <div class="footer-max-width section-max-width">
      <div class="footer-content">
        <div class="footer-newsletter">
          <img alt="Feedback Hub Logo" src="/icon_trans.png" class="footer-image">
          <span>CLARITY IN REVIEWS, CONFIDENCE IN CHOICE</span>
          <span class="body-small">© 2023 FeedbackHub. All rights reserved.</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
